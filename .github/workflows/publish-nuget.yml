name: Publish NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build SPA
        working-directory: src/RunWay.Dashboard/SPA
        run: |
          npm ci
          npm run build

      - name: Build
        run: |
          dotnet build src/RunWay.Core/RunWay.Core.csproj \
            --configuration Release \
            -p:Version=${{ steps.version.outputs.VERSION }}
          dotnet build src/RunWay/RunWay.csproj \
            --configuration Release \
            -p:Version=${{ steps.version.outputs.VERSION }}
          dotnet build src/RunWay.EntityFramework/RunWay.EntityFramework.csproj \
            --configuration Release \
            -p:Version=${{ steps.version.outputs.VERSION }}
          dotnet build src/RunWay.Runner/RunWay.Runner.csproj \
            --configuration Release \
            -p:Version=${{ steps.version.outputs.VERSION }}
          dotnet build src/RunWay.Dashboard/RunWay.Dashboard.csproj \
            --configuration Release \
            -p:Version=${{ steps.version.outputs.VERSION }}
          dotnet build src/RunWay.PostgreSQL/RunWay.PostgreSQL.csproj \
            --configuration Release \
            -p:Version=${{ steps.version.outputs.VERSION }}
          dotnet build src/RunWay.SqlServer/RunWay.SqlServer.csproj \
            --configuration Release \
            -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Pack
        run: |
          dotnet pack src/RunWay.Core/RunWay.Core.csproj \
            --configuration Release --no-build \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            --output ./nupkgs
          dotnet pack src/RunWay/RunWay.csproj \
            --configuration Release --no-build \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            --output ./nupkgs
          dotnet pack src/RunWay.EntityFramework/RunWay.EntityFramework.csproj \
            --configuration Release --no-build \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            --output ./nupkgs
          dotnet pack src/RunWay.Runner/RunWay.Runner.csproj \
            --configuration Release --no-build \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            --output ./nupkgs
          dotnet pack src/RunWay.Dashboard/RunWay.Dashboard.csproj \
            --configuration Release --no-build \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            --output ./nupkgs
          dotnet pack src/RunWay.PostgreSQL/RunWay.PostgreSQL.csproj \
            --configuration Release --no-build \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            --output ./nupkgs
          dotnet pack src/RunWay.SqlServer/RunWay.SqlServer.csproj \
            --configuration Release --no-build \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            --output ./nupkgs

      - name: Push to NuGet
        run: |
          dotnet nuget push ./nupkgs/Kododo.RunWay.Core.*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          dotnet nuget push ./nupkgs/Kododo.RunWay.*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          dotnet nuget push ./nupkgs/Kododo.RunWay.EntityFramework.*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          dotnet nuget push ./nupkgs/Kododo.RunWay.Runner.*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          dotnet nuget push ./nupkgs/Kododo.RunWay.Dashboard.*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          dotnet nuget push ./nupkgs/Kododo.RunWay.PostgreSQL.*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          dotnet nuget push ./nupkgs/Kododo.RunWay.SqlServer.*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
