name: Publish NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    # Trusted Publishing: nuget.org exchanges the workflow's OIDC token for a short-lived API key, so the repository
    # keeps no NuGet API key. Policy on nuget.org: owner kododo-dev, this repository, workflow publish-nuget.yml.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build SPA
        working-directory: src/RunWay.Dashboard/SPA
        run: |
          npm ci
          npm run build

      - name: Build
        run: |
          dotnet build src/RunWay.Core/RunWay.Core.csproj \
            --configuration Release \
            -p:Version=${{ steps.version.outputs.VERSION }}
          dotnet build src/RunWay/RunWay.csproj \
            --configuration Release \
            -p:Version=${{ steps.version.outputs.VERSION }}
          dotnet build src/RunWay.EntityFramework/RunWay.EntityFramework.csproj \
            --configuration Release \
            -p:Version=${{ steps.version.outputs.VERSION }}
          dotnet build src/RunWay.Runner/RunWay.Runner.csproj \
            --configuration Release \
            -p:Version=${{ steps.version.outputs.VERSION }}
          dotnet build src/RunWay.Dashboard/RunWay.Dashboard.csproj \
            --configuration Release \
            -p:Version=${{ steps.version.outputs.VERSION }}
          dotnet build src/RunWay.PostgreSQL/RunWay.PostgreSQL.csproj \
            --configuration Release \
            -p:Version=${{ steps.version.outputs.VERSION }}
          dotnet build src/RunWay.SqlServer/RunWay.SqlServer.csproj \
            --configuration Release \
            -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Pack
        run: |
          dotnet pack src/RunWay.Core/RunWay.Core.csproj \
            --configuration Release --no-build \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            --output ./nupkgs
          dotnet pack src/RunWay/RunWay.csproj \
            --configuration Release --no-build \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            --output ./nupkgs
          dotnet pack src/RunWay.EntityFramework/RunWay.EntityFramework.csproj \
            --configuration Release --no-build \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            --output ./nupkgs
          dotnet pack src/RunWay.Runner/RunWay.Runner.csproj \
            --configuration Release --no-build \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            --output ./nupkgs
          dotnet pack src/RunWay.Dashboard/RunWay.Dashboard.csproj \
            --configuration Release --no-build \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            --output ./nupkgs
          dotnet pack src/RunWay.PostgreSQL/RunWay.PostgreSQL.csproj \
            --configuration Release --no-build \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            --output ./nupkgs
          dotnet pack src/RunWay.SqlServer/RunWay.SqlServer.csproj \
            --configuration Release --no-build \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            --output ./nupkgs

      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
